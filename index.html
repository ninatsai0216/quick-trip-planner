<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>學生團行程速排</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左側 5 個步驟的簡易填表，右側 A4 即時預覽；手機上下堆疊 */
:root{
  --bg:#edf0f3; --panel:#ffffff; --field:#f8fafb; --ink:#1b2733; --muted:#5b6977; --line:#d3dae1;
  --accent:#155e75; --accent-ink:#ffffff; --accent-soft:#e2eff3;
  --warn-bg:#fff6e0; --warn-ink:#7a5200; --warn-line:#efd394;
  --alert-bg:#fdecec; --alert-ink:#9f1d1d; --alert-line:#f0a8a8;
  --sheet:#ffffff; --sheet-ink:#111111; --sheet-line:#333333; --sheet-head:#e6e6e6; --hl:#d40000;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171c; --panel:#192128; --field:#141b21; --ink:#e3e9ee; --muted:#93a2af; --line:#2c3842;
  --accent:#5fb4cb; --accent-ink:#0b1a20; --accent-soft:#1d313a;
  --warn-bg:#2b2412; --warn-ink:#f0cf86; --warn-line:#5a4a22; --alert-bg:#3a1818; --alert-ink:#ffb4b4; --alert-line:#7a3030; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --panel:#192128; --field:#141b21; --ink:#e3e9ee; --muted:#93a2af; --line:#2c3842;
  --accent:#5fb4cb; --accent-ink:#0b1a20; --accent-soft:#1d313a;
  --warn-bg:#2b2412; --warn-ink:#f0cf86; --warn-line:#5a4a22; --alert-bg:#3a1818; --alert-ink:#ffb4b4; --alert-line:#7a3030; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:16px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.app{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.app{grid-template-columns:minmax(0,1fr)}}
.form{display:flex;flex-direction:column;gap:12px;min-width:0}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step h2{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
.step h2 .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;display:grid;place-items:center;font-family:var(--mono);flex:none}
.step h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus,button:focus-visible,[contenteditable]:focus,.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono)}
.total{font-size:13px;color:var(--muted)}
.total b{color:var(--ink);font-family:var(--mono);font-size:16px}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;height:100%}
.pick b{font-size:16px}
.pick small{font-size:12px;color:var(--muted);line-height:1.45}
.pick input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.fl{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chip{font:inherit;font-size:12px;font-family:var(--mono);border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.spotchips{max-height:150px;overflow:auto;font-family:var(--sans)}
.spotchips .chip{font-family:var(--sans)}
.lookup{font-size:12px;color:var(--muted)}
.lookup.bad{color:var(--warn-ink)}
.lookup a{color:var(--accent)}
details.more summary{cursor:pointer;font-size:13px;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
details.more .grid{margin-top:8px}
.tog{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tog.on{border-color:var(--accent);background:var(--accent-soft)}
.tog>label.sw{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.tog>label.sw input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.f-lab{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.gen{display:flex;flex-direction:column;gap:8px;padding-block:4px 8px}
.stale{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:48px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;color:var(--muted);background:var(--panel)}
.empty b{color:var(--ink);font-size:16px}
.alert{border:1.5px solid var(--alert-line);background:var(--alert-bg);color:var(--alert-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.alert b{display:block;margin-bottom:2px}
.alert ul{margin:0;padding-left:18px}
.f-lab small{font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
button{font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.big{width:100%;padding:12px;font-size:16px}
button:disabled{opacity:.55;cursor:default}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);font-size:13px;padding:4px 8px}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
.status.err{color:var(--warn-ink)}
.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:960px){.pv{position:static}}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:12px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:12px;padding:10px 14px;font-size:13px}
.warn b{display:block;margin-bottom:4px}
.warn ul{margin:0;padding-left:18px}
.scroller{overflow:auto;max-height:calc(100vh - 220px);border-radius:4px}
@media (max-width:960px){.scroller{max-height:none}}
.sheet{background:var(--sheet);color:var(--sheet-ink);width:100%;min-width:640px;max-width:820px;margin:0 auto;padding:34px 30px 30px;box-shadow:0 1px 3px rgba(0,0,0,.15),0 8px 24px rgba(0,0,0,.08);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
.sheet h3{text-align:center;font-size:24px;margin:0 0 14px;font-weight:700}
.sheet .pax{font-weight:700;font-size:16px;margin:0 0 4px}
table.it{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14.5px;line-height:1.6}
table.it th,table.it td{border:1px solid var(--sheet-line);padding:3px 8px;vertical-align:middle}
table.it th{background:var(--sheet-head);font-weight:500}
table.it td:first-child{text-align:center}
table.it td{font-variant-numeric:tabular-nums}
.sheet .red{color:var(--hl)}
.sheet .b{font-weight:700}
.sheet .c{text-align:center}
.sheet .note{font-weight:700;margin:12px 0 0;font-size:15px}
[contenteditable]:hover{background:rgba(21,94,117,.06)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>學生團行程速排</h1>
    <div class="btns"><button type="button" class="ghost" id="btn-sample">載入範例</button><button type="button" class="ghost" id="btn-clear">清空重填</button></div>
  </header>

  <div class="app">
    <form class="form" id="form" autocomplete="off" onsubmit="return false">

      <section class="step">
        <h2><span class="n">1</span>學校與日期</h2>
        <div class="grid g2">
          <label class="f">校名<input id="f-school" data-k="school" placeholder="例：OO高中"></label>
          <label class="f">地區<select id="f-region" data-k="region"></select></label>
          <label class="f">出發日期<input id="f-start" type="date" data-k="start"></label>
          <label class="f">天數<select id="f-days" data-k="days"></select></label>
        </div>
      </section>

      <section class="step">
        <h2><span class="n">2</span>人數 <small id="pax-total"></small></h2>
        <div class="grid g3">
          <label class="f">學生<input id="f-students" data-k="students" inputmode="numeric" class="mono"></label>
          <label class="f">老師<input id="f-teachers" data-k="teachers" inputmode="numeric" class="mono"></label>
          <label class="f">家長<input id="f-parents" data-k="parents" inputmode="numeric" class="mono"></label>
          <label class="f">內勤<input id="f-staff" data-k="staff" inputmode="numeric" class="mono"></label>
          <label class="f">領隊<input id="f-leaders" data-k="leaders" inputmode="numeric" class="mono"></label>
        </div>
      </section>

      <section class="step">
        <h2><span class="n">3</span>航班</h2>
        <div class="picks">
          <label class="pick"><input type="radio" name="pattern" id="f-pat-mid" value="mid" data-k="pattern"><span><b>早去午回</b><small>去程 10 點前起飛<br>回程 12–15 點起飛</small></span></label>
          <label class="pick"><input type="radio" name="pattern" id="f-pat-late" value="late" data-k="pattern"><span><b>早去晚回</b><small>去程 10 點前起飛<br>回程 16–18 點起飛，最晚 15 點出發去機場</small></span></label>
        </div>
        <div class="fl">
          <label class="f">去程航班（知道再填）<input id="f-out-no" data-k="out.no" class="mono" placeholder="例：CI100"></label>
          <div class="chips" id="out-chips"></div>
          <div class="lookup" id="out-lookup"></div>
        </div>
        <div class="fl">
          <label class="f">回程航班（知道再填）<input id="f-back-no" data-k="back.no" class="mono" placeholder="例：CI105"></label>
          <div class="chips" id="back-chips"></div>
          <div class="lookup" id="back-lookup"></div>
        </div>
        <details class="more" id="more-times">
          <summary>自己填起飛／抵達時間（選填）</summary>
          <div class="grid g2">
            <label class="f">去程起飛<input id="f-out-dep" data-k="out.dep" class="mono"></label>
            <label class="f">去程抵達<input id="f-out-arr" data-k="out.arr" class="mono"></label>
            <label class="f">回程起飛<input id="f-back-dep" data-k="back.dep" class="mono"></label>
            <label class="f">回程抵達<input id="f-back-arr" data-k="back.arr" class="mono"></label>
          </div>
        </details>
      </section>

      <section class="step">
        <h2><span class="n">4</span>行程重點 <small>不確定的欄位選「自動安排」</small></h2>
        <div class="tog" id="tog-ex">
          <label class="sw"><input type="checkbox" id="f-exOn" data-k="exOn">學校交流</label>
          <input id="f-exSchool" data-k="exSchool" placeholder="交流學校校名（留空＝待媒合）">
          <div class="grid g3">
            <label class="f">哪一天<select id="f-exDay" data-k="exDay" class="daysel"></select></label>
            <label class="f">開始<select id="f-exStart" data-k="exStart" class="timesel"></select></label>
            <label class="f">結束<select id="f-exEnd" data-k="exEnd" class="timesel"></select></label>
          </div>
        </div>
        <div class="tog" id="tog-hs">
          <label class="sw"><input type="checkbox" id="f-hsOn" data-k="hsOn">HOMESTAY</label>
          <div class="grid g3">
            <label class="f">地區<select id="f-hsArea" data-k="hsArea"></select></label>
            <label class="f">入村日<select id="f-hsDay" data-k="hsDay" class="daysel"></select></label>
            <label class="f">入村時間<select id="f-hsTime" data-k="hsTime" class="timesel"></select></label>
          </div>
          <input id="f-hsCustom" data-k="hsCustom" placeholder="自填地區">
        </div>
        <div class="tog" id="tog-fr">
          <label class="sw"><input type="checkbox" id="f-frOn" data-k="frOn">城市自由探索</label>
          <div class="grid g3">
            <label class="f">哪一天<select id="f-frDay" data-k="frDay" class="daysel"></select></label>
            <label class="f">開始<select id="f-frStart" data-k="frStart" class="timesel"></select></label>
            <label class="f">結束<select id="f-frEnd" data-k="frEnd" class="timesel"></select></label>
          </div>
          <div class="grid g2">
            <label class="f">附交通券<select id="f-frPass" data-k="frPass"></select></label>
            <label class="f">午晚餐代金（日圓）<select id="f-frVoucher" data-k="frVoucher"></select></label>
          </div>
          <input id="f-frPassCustom" data-k="frPassCustom" placeholder="自填交通券，例：京都巴士一日券">
        </div>
        <div class="tog" id="tog-pk">
          <label class="sw"><input type="checkbox" id="f-pkOn" data-k="pkOn">樂園</label>
          <div class="grid g3">
            <label class="f">樂園<select id="f-park" data-k="park"></select></label>
            <label class="f">哪一天<select id="f-pkDay" data-k="pkDay" class="daysel"></select></label>
            <label class="f">午晚餐代金（日圓）<select id="f-pkVoucher" data-k="pkVoucher"></select></label>
          </div>
        </div>
        <div class="alert" id="opt-alert" role="alert" hidden></div>
        <div class="fl"><span class="f-lab">住宿 <small id="hotel-hint"></small></span><div class="grid g2" id="hotels"></div></div>
      </section>

      <section class="step">
        <h2><span class="n">5</span>必去景點 <small>一行一個，系統自動分天排時間</small></h2>
        <textarea id="f-spots" data-k="spots" rows="7" placeholder="一行填一個景點，或點下方常見景點加入"></textarea>
        <p class="hint">景點時間與車程為系統暫時設定，請以 Google Map 查詢的時間為主。</p>
        <p class="hint">常見景點，點一下加入：</p>
        <div class="chips spotchips" id="spot-chips"></div>
        <div class="alert" id="spot-alert" role="alert" hidden></div>
        <label class="chk"><input type="checkbox" id="f-aiFill" data-k="aiFill">有空白的天數，幫我補建議景點（會標示「建議」）</label>
      </section>

      <section class="step">
        <h2><span class="n">6</span>特殊需求 <small>選填，會印在行程表下方</small></h2>
        <textarea id="f-req" data-k="req" rows="3" placeholder="例：2 位素食、1 位海鮮過敏、需無障礙房、希望安排大學參訪"></textarea>
      </section>

      <div class="gen">
        <button type="button" class="pri big" id="btn-gen">產生行程表</button>
        <div class="status" id="gen-status" role="status"></div>
      </div>
    </form>

    <div class="pv">
      <div class="bar">
        <div class="btns">
          <button type="button" class="pri" id="btn-docx">下載 Word</button>
          <button type="button" id="btn-copy">複製表格</button>
        </div>
        <span class="badge" id="pv-badge">預覽中（尚未產生）</span>
        <span class="msg" id="msg" role="status">表格內容可以直接點進去修改。</span>
      </div>
      <div class="stale" id="stale" hidden>左邊資料有修改，預覽已更新。確認後請再按一次「產生行程表」才能下載。</div>
      <div class="warn" id="warn"></div>
      <div class="scroller" id="pv-scroller">
        <div class="sheet" id="sheet">
          <h3 id="pv-title" contenteditable="true"></h3>
          <p class="pax" id="pv-pax" contenteditable="true"></p>
          <table class="it">
            <colgroup><col style="width:10%"><col style="width:57%"><col style="width:33%"></colgroup>
            <thead><tr><th>日期</th><th>行程內容</th><th>備註</th></tr></thead>
            <tbody id="pv-body"></tbody>
          </table>
          <p class="note req" id="pv-req" contenteditable="true" hidden></p>
          <p class="note" id="pv-note" contenteditable="true">為參考行程，實際行程因活動日期、住宿檔次、實際航班、餐膳規劃不同，而有所不同。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<datalist id="dl-hotel"></datalist>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

  '關西':{city:'大阪',pass:['大阪地下鐵一日券','JR一日券'],apts:['關西','神戶'],meals:[['大阪燒+章魚燒DIY','B'],['京都湯豆腐御膳','L'],['串炸套餐','D']]},

  '中部北陸':{city:'名古屋',pass:['JR一日券'],apts:['中部','小松','富山'],meals:[['飛驒牛朴葉味噌燒定食','B'],['味噌豬排定食','L'],['信州蕎麥麵','L'],['金澤海鮮丼','L'],['名古屋手羽先套餐','D']]}

const WD='日一二三四五六';
const pad=n=>String(n).padStart(2,'0');
function toMin(v){const s=String(v||'').replace(/[^0-9]/g,'');if(s.length<3||s.length>4)return null;const p=s.padStart(4,'0');const h=+p.slice(0,2),m=+p.slice(2);if(h>29||m>59)return null;return h*60+m;}
const fmt=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+pad(((m%60)+60)%60);
const up=(m,st)=>Math.ceil(m/st)*st;
const down=(m,st)=>Math.floor(m/st)*st;
const clone=o=>JSON.parse(JSON.stringify(o));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const isBuffet=n=>/吃到飽|放題|自助/.test(n);
function normFlight(v){const m=String(v||'').toUpperCase().replace(/\s+/g,'').match(/^([A-Z0-9]{2})0*(\d{1,4})$/);if(!m)return null;return m[1]+(m[2].length<3?m[2].padStart(3,'0'):m[2]);}
function spotList(S){return String(S.spots||'').split('\n').map(s=>s.trim()).filter(Boolean);}

function parseLines(arr){
  return (arr||[]).map(l=>String(l).trim()).filter(Boolean).map(l=>{
    let red=false;if(/^[*＊]/.test(l)){red=true;l=l.replace(/^[*＊]\s*/,'');}
    l=l.replace(/(\d{1,2}):(\d{2})/g,(_,h,m)=>pad(h)+m);
    const m=l.match(/^(\d{3,4})\s*(?:[-~～–]\s*(\d{3,4}))?/);
    let s=null,e=null;if(m){s=toMin(m[1]);e=m[2]?toMin(m[2]):null;}
    return {s,e,raw:l,red,user:true};
  });
}
function mk(s,e,text,o={}){let pre='';if(s!=null){pre=fmt(s);if(e!=null)pre+='-'+fmt(e);else if(o.tilde)pre+='~';pre+=' ';}return {s,e,raw:pre+text,red:!!o.red};}

/* 航班實際採用的資料：自填時間 > 內建時刻 > 依時段估算 */
function effFlight(S,k){
  const reg=REGIONS[S.region]||REGIONS['關東'],L=S[k]||{};
  const code=normFlight(L.no),f=code?FLIGHTS[code]:null;
  const r={code,found:!!f,airline:code?(AIRLINES[code.slice(0,2)]||''):'',est:false};
  if(k==='out'){r.depApt=f?f.depApt:'桃園';r.arrApt=f?f.arrApt:reg.apts[0];}
  else{r.depApt=f?f.depApt:reg.apts[0];r.arrApt=f?f.arrApt:'桃園';}
  const dur=k==='out'?(OUT_DUR[r.arrApt]||240):(BACK_DUR[r.depApt]||150);
  let dep=toMin(L.dep),arr=toMin(L.arr);
  if(dep==null&&f){dep=toMin(f.dep);if(arr==null)arr=toMin(f.arr);}
  if(dep==null){dep=k==='out'?530:(PAT[S.pattern]||PAT.late).defBack;r.est=true;}
  if(arr==null){arr=dep+dur;if(!f)r.est=true;}
  r.dep=dep;r.arr=arr;return r;
}

/* 自動安排交流、HOMESTAY、自由日、每天的可排時段（三者可同一天，只檢查時間是否衝突） */
function frame(S){
  const N=Math.max(4,+S.days||6),reg=REGIONS[S.region]||REGIONS['關東'];
  const out=effFlight(S,'out'),back=effFlight(S,'back');
  const notes=[],alerts=[],dn=i=>`第 ${i+1} 天`;
  const pickDay=(v,name)=>{if(v===''||v==null)return null;const i=+v;if(i>=1&&i<=N-2)return i;alerts.push(`${name}選的${dn(i)}不能用（第一天和最後一天不能排），已改成自動安排。`);return null;};
  let hs=-1,ex=-1,fr=-1;
  if(S.hsOn){const c=pickDay(S.hsDay,'HOMESTAY');hs=c!=null?c:N-2;}
  const mids=[];for(let i=1;i<=N-2;i++)mids.push(i);
  if(S.exOn){const c=pickDay(S.exDay,'學校交流');ex=c!=null?c:(mids.filter(i=>i!==hs).includes(2)?2:(mids.find(i=>i!==hs)??mids[0]));}
  if(S.frOn){const c=pickDay(S.frDay,'城市探索');fr=c!=null?c:(mids.find(i=>i>ex&&i!==hs&&i!==ex)??mids.find(i=>i!==hs&&i!==ex)??mids[0]);}
  let pk=-1;if(S.pkOn){const c=pickDay(S.pkDay,'樂園');pk=c!=null?c:(mids.find(i=>i!==hs&&i!==ex&&i!==fr)??mids.find(i=>i!==hs)??mids[0]);}
  const parkName=S.park||PARKS[S.region]||'';if(S.pkOn&&!parkName)alerts.push('樂園還沒選（這個地區沒有預設樂園）。');
  let exS=toMin(S.exStart),exE=toMin(S.exEnd);if(exS==null)exS=exE!=null?exE-AUTO.exLen:(hs>=0&&ex===hs+1?600:AUTO.exStart);if(exE==null)exE=exS+AUTO.exLen;
  const frS=toMin(S.frStart)??(hs>=0&&fr===hs+1?600:AUTO.frStart),frE=toMin(S.frEnd)??AUTO.frEnd;
  if(S.exOn&&exE<=exS)alerts.push('學校交流的結束時間比開始時間早，請重新選。');
  if(S.frOn&&frE<=frS)alerts.push('城市探索的結束時間比開始時間早，請重新選。');
  const area=(S.hsArea==='__custom'?(S.hsCustom||'').trim():(S.hsArea||HS_DEFAULT[S.region]||''))||'（地區待選）';
  if(S.hsOn&&area==='（地區待選）')alerts.push('HOMESTAY 還沒選地區（這個地區沒有預設的 HOMESTAY 地點）。');
  const hsT=toMin(S.hsTime)??AUTO.hsTime;
  let leave=back.dep-180;if(S.pattern!=='mid')leave=Math.min(900,leave);leave=down(leave,30);
  const days=[];
  for(let i=0;i<N;i++){
    const first=i===0,last=i===N-1;
    const blocks=[];
    if(i===ex)blocks.push([exS,exE,'學校交流']);
    if(i===fr)blocks.push([frS,frE,'城市探索']);
    if(i===pk)blocks.push([540,1230,'樂園']);
    if(i===hs)blocks.push([hsT,hsT+30,'HOMESTAY 入村式']);
    /* 衝突檢查 */
    for(let a=0;a<blocks.length;a++)for(let b=a+1;b<blocks.length;b++){
      const A=blocks[a],B=blocks[b];
      if(A[0]<B[1]&&B[0]<A[1])alerts.push(`${dn(i)}的${A[2]}（${fmt(A[0])}-${fmt(A[1])}）和${B[2]}（${fmt(B[0])}-${fmt(B[1])}）時間重疊。`);
    }
    if(i===hs)blocks.filter(b=>b[2]!=='HOMESTAY 入村式'&&b[1]<=hsT&&hsT-b[1]<60).forEach(b=>alerts.push(`${dn(i)}${b[2]}到 ${fmt(b[1])} 結束，離 HOMESTAY 入村 ${fmt(hsT)} 不到 1 小時，可能來不及移動。`));
    if(i-1===hs&&i!==N-1)blocks.filter(b=>b[0]<570).forEach(b=>alerts.push(`${dn(i)}早上要從 HOMESTAY 退村（約 09:00），${b[2]} ${fmt(b[0])} 開始太早。`));
    let start=510,end=1230,lunch=true,dinner=true,type='normal',lunchBy='',dinnerBy='';
    if(first){type='first';start=up(out.arr+120,30);lunch=out.arr+90<=750;dinner=out.arr+90<=1230;}
    else if(last){type='last';start=i-1===hs?540:480;end=leave;lunch=leave>=780;dinner=false;}
    else{
      if(i-1===hs)start=540;
      if(i===hs){type='hs';end=hsT-30;dinner=false;dinnerBy='hs';}
      else if(i===pk)type='park';else if(i===ex)type='ex';else if(i===fr)type='free';
      if(i===ex&&exS<=720&&exE>=780){lunch=false;lunchBy='ex';}
      else if(i===fr&&frS<=720&&frE>=780){lunch=false;lunchBy='fr';}
      if(dinner&&i===fr&&frS<=1080&&frE>=1110){dinner=false;dinnerBy='fr';}
      if(i===pk){lunch=false;lunchBy='pk';dinner=false;dinnerBy='pk';}
    }
    /* 景點可排的空檔：扣掉固定行程，取最長的一段 */
    const fixed=blocks.filter(b=>b[2]!=='HOMESTAY 入村式').map(b=>[b[0],b[1]]).sort((x,y)=>x[0]-y[0]);
    let cur=start,best=[0,0];
    fixed.forEach(([bs,be])=>{if(bs-30-cur>best[1]-best[0])best=[cur,bs-30];cur=Math.max(cur,be+30);});
    if(end-cur>best[1]-best[0])best=[cur,end];
    days.push({i,type,start:best[0],end:best[1],lunch,dinner,lunchBy,dinnerBy});
  }
  return {N,reg,out,back,hs,ex,fr,pk,parkName,area,hsT,leave,days,notes,alerts,exS,exE,frS,frE};
}

function dateLabel(S,i){if(!S.start)return {md:`Day${i+1}`,wd:''};const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+i);return {md:`${pad(d.getMonth()+1)}/${pad(d.getDate())}`,wd:WD[d.getDay()]};}

    if(first){
      const apt=out.dep-170;
      items.push(mk(apt-30,apt-15,'學校報到&出發'),mk(apt,apt+30,'機場報到&登機'),mk(out.arr,out.arr+90,`抵達${out.arrApt}機場&出關`));
      flights.push(['out',out]);meals.b='自理';
      if(!D.lunch)meals.l=out.dep>=840?'自理':'機上餐';else earliestL=up(out.arr+100,30);
      if(!D.dinner)meals.d=out.dep>=1020?'機上餐':'自理（待確認）';
    }else if(i-1===hs){
      items.push(mk(420,510,'早餐'),mk(510,540,'退村式'));meals.b='HOMESTAY';
    }else if((i!==fr||F.frS>=660||i===ex||i===hs)&&!(i===F.pk&&i!==ex&&i!==hs)){
      const chk=last||hotel(i-1)!==hotel(i);
      items.push(mk(420,480,'早餐'));meals.b='飯店';
    }else meals.b='飯店';

    if(last){
      items.push(mk(back.dep-120,back.dep,'機場報到&登機'),mk(back.arr,back.arr+20,`抵達${back.arrApt}機場&出關`));

      if(!D.lunch)meals.l=back.arr<=720?'自理':'機上餐';

    }
    if(i===fr){
      const pass=S.frPass==='__custom'?(S.frPassCustom||'').trim():(S.frPass||reg.pass[0]);
      const v=String(S.frVoucher||'').trim()||AUTO.voucher;
      const vt=v?`代金 ${v}`:'代金（金額待填）';
      if(D.lunchBy==='fr')meals.l=vt;if(D.dinnerBy==='fr')meals.d=vt;
      const ptxt=pass&&pass!=='__none'?`（附${pass}）`:'',fullDay=F.frS<=600&&F.frE>=1140&&i!==ex&&i!==hs&&i!==F.pk;
      items.push(fullDay?mk(null,null,'全日城市探索'+ptxt):mk(F.frS,F.frE,'城市探索'+ptxt));
    }
    if(i===ex){
      items.push(mk(F.exS,F.exE,`學校交流（${(S.exSchool||'').trim()||'待媒合'}）`));if(D.lunchBy==='ex')meals.l='交流學校便當';
    }
    items=items.concat(user);
    if(i===hs){
      items.push(mk(F.hsT,F.hsT+30,`${area}民家 HOMESTAY 入村式`),mk(F.hsT+30,null,'由入住家庭帶領，前往住宿及晚餐',{tilde:true}));
      meals.d='HOMESTAY';
    }
    if(i===F.pk){const v=`代金 ${String(S.pkVoucher||'').trim()||'1500'}`;meals.l=v;meals.d=v;needL=false;needD=false;
      items.push(mk(null,null,'全日'+F.parkName+(/迪士尼/.test(F.parkName)?'（附飯店-迪士尼來回地鐵票）':'')));
      if(!last&&i!==hs&&hotel(i-1)!==hotel(i))items.push(mk(null,null,'飯店 CHECK IN'));}
    if(plan.disneyDays.includes(i)){const v=`代金 ${String(S.pkVoucher||'').trim()||'1500'}`;meals.l=v;meals.d=v;needL=false;needD=false;}
    if(needL&&has('午餐（園內')){meals.l='園內自理';needL=false;}
    if(needL){
      const name=pick('L');meals.l=name;
      if(!has('午餐')){
        const cov=items.filter(it=>it.s!=null&&it.s<750&&(it.e??it.s)>720);
        let s=Math.max(earliestL,cov.length?up(Math.max(...cov.map(c=>c.e??c.s))+10,30):720),dur=isBuffet(name)?90:60;
        const nx=items.filter(it=>it.s!=null&&it.s>=s).map(it=>it.s),nextS=nx.length?Math.min(...nx):null;
        if(nextS!=null&&s+dur>nextS){dur=60;if(s+dur>nextS)s=Math.max(earliestL,down(nextS-60,30));}
        items.push(mk(s,s+dur,'午餐'));
      }
    }
    if(needD){
      const name=pick('D');meals.d=name;
      if(!has('晚餐')){
        const before=items.filter(it=>it.s!=null&&it.s<=1170);
        const le=before.length?Math.max(...before.map(c=>c.e??c.s)):null;
        const s=Math.max(1050,le!=null?up(le+10,30):1080);
        items.push(mk(s,s+(isBuffet(name)?90:60),'晚餐'));
      }
    }
    if(!meals.l)meals.l='（待確認）';if(!meals.d)meals.d='（待確認）';

    let k=-1;items.forEach((it,idx)=>{if(it.s!=null)k=it.s;it.key=k;it.ord=idx;});
    items.sort((a,b)=>a.key-b.key||a.ord-b.ord);
    if(!last&&i!==hs&&i!==F.pk&&(i!==fr||i===ex)){
      const ends=items.filter(it=>it.s!=null).map(it=>it.e??it.s);
      const t=ends.length?up(Math.max(...ends)+15,15):null;
      items.push(mk(t,null,first||hotel(i-1)!==hotel(i)?'飯店 CHECK IN':'返回飯店休息'));
    }
    if(last){const late=user.filter(u=>u.s!=null&&(u.e??u.s)>F.leave);if(late.length)warn.push(`最後一天有景點超過 ${fmt(F.leave)} 出發去機場的時間，請調整。`);}

    const rem=[];
    flights.forEach(([kk,f])=>{
      rem.push({t:f.code?`${f.airline} ${f.code}`.trim():`航班待確認（${(PAT[S.pattern]||PAT.late).name}）`,b:1,c:1});
      const pre=f.est?'約':'';
      rem.push({t:`${f.depApt} ${pre}${fmt(f.dep)}/ ${f.arrApt} ${pre}${fmt(f.arr)}`,b:1,c:1});
    });
    rem.push({t:'早餐：'+meals.b},{t:'午餐：'+meals.l},{t:'晚餐：'+meals.d},{t:'住宿：'+hotel(i)});
    days.push({md:lb.md,wd:lb.wd,sched:items.map(it=>({t:it.raw,red:it.red})),rem});
  }

  if(out.dep>=600)warn.push(`去程 ${fmt(out.dep)} 起飛，不是早去（10 點前）的航班，請確認。`);
  const pw=(PAT[S.pattern]||PAT.late).back;
  if(back.dep<pw[0]||back.dep>pw[1])warn.push(`回程 ${fmt(back.dep)} 起飛，不在「${(PAT[S.pattern]||PAT.late).name}」的時段內，請確認。`);
  if(out.est||back.est)warn.push('沒有航班號碼的部分，起降時間是依時段估算（標「約」），訂到航班後要更新。');
  else warn.push('航班時刻取自 2026/10 網路時刻表，依日期與季節會變動，需上網查證。');
  if(!spotList(S).length)warn.push('還沒填必去景點。');
  const spotAlerts=[];
  plan.unplaced.forEach(n=>spotAlerts.push(`「${n}」排不進去：時間不夠。建議增加天數、刪掉其他景點，或縮短交流／城市探索的時間。`));
  plan.over.forEach(n=>spotAlerts.push(n));
  warn.unshift(...spotAlerts);
  plan.notes.forEach(n=>warn.push(n));
  if(days.some(d=>d.rem.some(x=>x.t==='住宿：'+defHotel)))warn.push(`沒填的晚上住宿暫訂「${defHotel}」。`);
  if(!S.start)warn.push('出發日期未填，日期欄先以 Day 表示。');

  const st=S.students!=null?(+S.students||0):((+S.female||0)+(+S.male||0)),t=+S.teachers||0,pa=+S.parents||0,sf=+S.staff||0,l=+S.leaders||0,tot=st+t+pa+sf+l;
  const parts=[`學生 ${st} 名`];
  if(t)parts.push(`老師 ${t} 名`);if(pa)parts.push(`家長 ${pa} 名`);if(sf)parts.push(`內勤 ${sf} 名`);if(l)parts.push(`${l} 領隊`);
  const yr=S.start?S.start.slice(0,4)+'年':'';
  return {title:`${yr}${S.school||'OO高中'}日本${S.region}教育旅行 ${N} 日`,pax:`人數：${parts.join('+')}=${tot} 人`,days,warn,spotAlerts,total:tot,frame:F};
}

const DB={};
Object.entries(SPOT_DB).forEach(([r,txt])=>{DB[r]=txt.trim().split('\n').map(l=>{const[n,k,a,b,d]=l.split('|');return {name:n,kw:k.split(',').map(s=>s.toLowerCase()),ll:[+a,+b],dur:+d};});});

function km(a,b){const R=6371,t=Math.PI/180,dLa=(b[0]-a[0])*t,dLo=(b[1]-a[1])*t;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
/* 估算車程（分鐘）：遊覽車，市區慢、高速快 */
function drive(a,b){const d=km(a,b)*1.3;if(d<2)return 15;const sp=d<15?18:d<50?32:55;return Math.min(300,up(d/sp*60+10,10));}

function matchSpot(region,text){
  const t=text.toLowerCase();let best=null,bl=0;
  (DB[region]||[]).forEach(e=>e.kw.forEach(k=>{if(k&&t.includes(k)&&k.length>bl){best=e;bl=k.length;}}));
  return best;
}

  const aptIn=APT_LL[F.out.arrApt]||city,aptOut=APT_LL[F.back.depApt]||city;
  const unknown=[],spots=spotList(S).filter(txt=>!(S.pkOn&&/迪士尼|環球|usj|disney/i.test(txt))).map(txt=>{
    const m=matchSpot(S.region,txt),generic=!m&&/體驗|體験|DIY|diy|教室|講座|說明會|參訪/.test(txt);
    if(!m&&!generic)unknown.push(txt);
    let extra=m&&/迪士尼/.test(m.name)&&!/附飯店/.test(txt)?'（附飯店-迪士尼來回地鐵票）':'';
    if(m&&/晴空塔/.test(m.name)&&!/天望|350/.test(txt))extra+='（上天望甲板350m）';
    let dur=m?m.dur:(generic?60:90);if(/和服/.test(txt))dur=Math.max(dur,150);
    return {txt:txt+extra,ll:m?m.ll:city,dur,full:m?m.dur>=300:false,known:!!m,disney:!!extra||(m&&/迪士尼/.test(m.name))};
  });
  /* 每天的起點、終點與最晚時間（含移動到終點的車程） */
  const days=F.days.map(d=>{
    const o={d,spots:[]};
    if(d.end<=d.start){o.off=true;return o;}
    let s0=city,s1=city,limit=1140;
    if(d.type==='first'){s0=aptIn;limit=1170;}
    if(d.i>0&&d.i-1===F.hs)s0=hsLL;
    if(d.type==='hs'){s1=hsLL;limit=d.end+30;}
    if(d.type==='last'){s1=aptOut;limit=d.end+60;}
    if(d.end<1080&&d.type!=='hs'&&d.type!=='last')limit=Math.min(limit,d.end+30);
    Object.assign(o,{s0,s1,startT:d.start,limit,maxN:{first:1,ex:2,hs:2,last:2,free:2}[d.type]||4});
    return o;
  });
  const orderSpots=(o,list)=>{let cur=o.s0,rest=list.slice(),seq=[];while(rest.length){rest.sort((a,b)=>(km(cur,a.ll)+km(a.ll,o.s1)*0.6)-(km(cur,b.ll)+km(b.ll,o.s1)*0.6));const n=rest.shift();seq.push(n);cur=n.ll;}return seq;};
  const timeline=(o,list)=>{
    const seq=orderSpots(o,list),lines=[];let t=o.startT,prev=o.s0,lunch=!o.d.lunch;
    seq.forEach(sp=>{
      t=up(t+drive(prev,sp.ll),10);
      if(!lunch&&(t>=690||t+sp.dur>810)){const ls=up(Math.max(690,t),30);lines.push(`${fmt(ls)}-${fmt(ls+60)} 午餐`);t=ls+70;lunch=true;}
      lines.push(`${fmt(t)}-${fmt(t+sp.dur)} ${sp.txt}`);t+=sp.dur;prev=sp.ll;
    });
    if(seq.length&&!lunch&&t<=780){const ls=up(Math.max(690,t+drive(prev,prev)),30);lines.push(`${fmt(ls)}-${fmt(ls+60)} 午餐`);t=ls+60;}
    return {lines,end:seq.length?t+drive(prev,o.s1):o.startT};
  };
  const unplaced=[];
  const order=spots.slice().sort((a,b)=>(b.full-a.full)||(km(b.ll,city)-km(a.ll,city)));
  order.forEach(sp=>{
    let best=null,bc=Infinity;
    days.forEach(o=>{
      if(o.off)return;
      if(sp.full){if(o.d.type==='normal'&&!o.spots.length&&0<bc){bc=0;best=o;}return;}
      if(o.spots.some(x=>x.full)||o.spots.length>=o.maxN)return;
      const withIt=timeline(o,o.spots.concat(sp));
      if(withIt.end>o.limit)return;
      const base=o.spots.length?timeline(o,o.spots).end:o.startT+drive(o.s0,o.s1);
      const c=withIt.end-base+o.spots.length*15;
      if(c<bc){bc=c;best=o;}
    });
    if(best)best.spots.push(sp);else unplaced.push(sp.txt);
  });
  if(S.aiFill){
    const usedNames=new Set(spots.filter(s=>s.known).map(s=>matchSpot(S.region,s.txt).name));
    days.forEach(o=>{
      if(o.off||o.spots.length||!['normal','hs'].includes(o.d.type))return;
      const ref=o.d.type==='hs'?hsLL:city;
      const cand=(DB[S.region]||[]).filter(e=>!usedNames.has(e.name)&&e.dur<300&&!/大學|專門|迪士尼|環球/.test(e.name)).sort((a,b)=>km(a.ll,ref)-km(b.ll,ref));
      for(const e of cand){
        if(o.spots.length>=2)break;
        const sp={txt:e.name+'（建議）',ll:e.ll,dur:e.dur,full:false,known:true};
        if(timeline(o,o.spots.concat(sp)).end>o.limit)continue;
        o.spots.push(sp);usedNames.add(e.name);
      }
    });
  }
  const disneyDays=[];
  const out=days.map(o=>{
    if(!o.spots.length)return [];
    if(o.spots[0].full){const sp=o.spots[0];
      if(sp.disney){disneyDays.push(o.d.i);return [`全日${sp.txt.replace(/^全日/,'')}`];}
      return [`0900-${fmt(Math.min(1170,540+sp.dur))} ${sp.txt}`,`1200-1300 午餐（園內）`];}
    const tl=timeline(o,o.spots);if(tl.end>o.limit+15)o.late=true;
    return tl.lines;
  });
  const notes=[];
  const over=[];
  days.forEach(o=>{if(o.late)over.push(`第 ${o.d.i+1} 天太滿：「${o.spots.map(x=>x.txt).join('」「')}」可能排不完，建議刪掉其中一個或增加天數。`);});
  if(unknown.length)notes.push('系統不認得位置、先排在市區附近的景點：'+unknown.join('、'));
  return {days:out,unplaced,notes,disneyDays,over};
}

    if(n.nodeType!==1||n.tagName==='BR')return;
    const red=n.classList.contains('red')||!!n.querySelector('.red,font[color]'),b=n.classList.contains('b'),c=n.classList.contains('c');
    n.innerText.split('\n').forEach(x=>{if(x.trim())out.push({t:x,red,b,c});});
  });
  return out;
}
function readSheet(){
  return {title:$('#pv-title').innerText.trim(),pax:$('#pv-pax').innerText.trim(),note:$('#pv-note').innerText.trim(),req:$('#pv-req').hidden?'':$('#pv-req').innerText.trim(),
    rows:[...$('#pv-body').rows].map(tr=>[...tr.cells].map(cellLines))};
}
/* ===== Word 產生 ===== */
const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const FONT='Microsoft JhengHei';
function wr(t,o={}){const sz=o.sz||22;return `<w:r><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/>${o.b?'<w:b/><w:bCs/>':''}${o.red?'<w:color w:val="E00000"/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;}
function wp(t,o={}){return `<w:p><w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after||0}" w:line="${o.line||288}" w:lineRule="auto"/>${o.c?'<w:jc w:val="center"/>':''}</w:pPr>${t?wr(t,o):''}</w:p>`;}
let CFG={sz:22,line:276};
function wc(lines,w,o={}){
  const ps=lines.length?lines.map(l=>wp(l.t,{...l,c:o.c||l.c,sz:o.sz||CFG.sz,line:CFG.line})).join(''):'<w:p/>';
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:vAlign w:val="center"/>${o.shade?'<w:shd w:val="clear" w:color="auto" w:fill="E6E6E6"/>':''}</w:tcPr>${ps}</w:tc>`;
}
/* 估算高度，挑最大且放得下一頁的字級：6 天內一頁，超過 6 天分兩頁（每頁最多 6 天） */
function fitCfg(D,pages){
  const usable=16838-1440;
  const head=2400+(D.req?600:0);
  const rowsLines=g=>g.reduce((a,r)=>a+Math.max(1,...r.map(c=>c.length)),0);
  const worst=Math.max(...pages.map(g=>rowsLines(g)+0)),rowsN=Math.max(...pages.map(g=>g.length));
  const opts=[{sz:22,line:276},{sz:22,line:252},{sz:21,line:240},{sz:20,line:240},{sz:19,line:240},{sz:18,line:240}];
  for(const o of opts){const lh=o.sz/2*1.45*20*o.line/240;if(worst*lh+rowsN*80+500+head<=usable)return o;}
  return opts[opts.length-1];
}
function docXml(D){
  const W=[1000,5966,3500],bd=['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="8" w:space="0" w:color="000000"/>`).join('');
  const pages=[];for(let i=0;i<D.rows.length;i+=6)pages.push(D.rows.slice(i,i+6));
  if(!pages.length)pages.push([]);
  CFG=fitCfg(D,pages);
  const head=`<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>${wc([{t:'日期'}],W[0],{c:1,shade:1})}${wc([{t:'行程內容'}],W[1],{c:1,shade:1})}${wc([{t:'備註'}],W[2],{c:1,shade:1})}</w:tr>`;
  const tbl=rows=>`<w:tbl><w:tblPr><w:tblW w:w="10466" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="30" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="30" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${head}${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${wc(r[0]||[],W[0],{c:1})}${wc(r[1]||[],W[1])}${wc(r[2]||[],W[2])}</w:tr>`).join('')}</w:tbl>`;
  const brk='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  const body=pages.map(tbl).join(brk);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>`+
    wp(D.title,{b:1,c:1,sz:36,after:160})+wp(D.pax,{b:1,sz:24,after:60})+body+(D.req?wp(D.req,{b:1,sz:22,before:160}):'')+wp(D.note,{b:1,sz:22,before:160})+
    `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="400" w:footer="400" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}
async function makeDocx(D){
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml',docXml(D));
  return z.generateAsync({type:'blob'});
}

let DL=null;
(async()=>{try{DL=window.claude?.use?await window.claude.use('downloads'):null;}catch(e){DL=null;}})();
$('#btn-docx').onclick=async()=>{
  const D=readSheet(),name=(D.title||'行程表').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'')+'.docx';
  let blob;try{blob=await makeDocx(D);}catch(e){msg('Word 檔產生失敗，請改用「複製表格」。');return;}
  if(DL){
    try{await DL.save({filename:name,data:blob});msg('已下載：'+name);}
    catch(e){msg(e&&e.code==='declined'?'已取消下載。':'下載沒有成功，可改用「複製表格」貼到 Word。');}
    return;
  }
  /* 放在公司網站等一般網頁時，用瀏覽器直接下載 */
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);msg('已下載：'+name+'（如果沒有反應，請改用「複製表格」）');
};

/* ===== 複製（貼到 Word 保留表格）===== */
function copyHtml(D){
  const st='font-family:Microsoft JhengHei;font-size:11pt;';
  const cell=(ls,w,c)=>`<td style="border:1px solid #000;padding:2px 6px;vertical-align:middle;width:${w};${c?'text-align:center;':''}">${ls.map(l=>`<div style="${l.red?'color:#E00000;':''}${l.b?'font-weight:bold;':''}${l.c||c?'text-align:center;':''}">${x(l.t)}</div>`).join('')}</td>`;
  return `<div style="${st}"><p style="text-align:center;font-size:18pt;font-weight:bold">${x(D.title)}</p><p style="font-weight:bold;font-size:12pt">${x(D.pax)}</p><table style="border-collapse:collapse;width:100%;${st}"><tr><th style="border:1px solid #000;background:#E6E6E6">日期</th><th style="border:1px solid #000;background:#E6E6E6">行程內容</th><th style="border:1px solid #000;background:#E6E6E6">備註</th></tr>${D.rows.map(r=>`<tr>${cell(r[0]||[],'10%',1)}${cell(r[1]||[],'57%')}${cell(r[2]||[],'33%')}</tr>`).join('')}</table>${D.req?`<p style="font-weight:bold;font-size:12pt">${x(D.req)}</p>`:''}<p style="font-weight:bold;font-size:12pt">${x(D.note)}</p></div>`;
}
$('#btn-copy').onclick=async()=>{
  const D=readSheet(),html=copyHtml(D);
  const plain=[D.title,D.pax,...D.rows.map(r=>r.map(c=>c.map(l=>l.t).join(' / ')).join('\t')),D.req,D.note].filter(Boolean).join('\n');
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);msg('已複製，到 Word 直接貼上即可。');}
  catch(e){
    try{const r=document.createRange();r.selectNodeContents($('#sheet'));const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');msg(ok?'已複製，到 Word 直接貼上即可。':'已選取整張行程表，請按 Ctrl+C（Mac：⌘C）複製。');}
    catch(e2){msg('請手動選取右側行程表後複製。');}
  }
};

fillForm();renderPreview();setReady(false);

</script>
